# Onboards axon to the global agentic loop (~/.claude/agents/forge.md).
# See docs/superpowers/specs/*loop-multi-repo-config*.

# wiring
repo_slug: sammyjdev/axon
default_branch: master            # axon uses master, not main
# Gate includes CI coverage (router + resilience + config) and extends pytest
# to the working area for the current backlog (store + scripts + cli + doctor).
# tests/cli and tests/doctor were verified green (non-interactive, no skips) on
# 2026-07-06 before being added here - see issue #60, which touches both dirs.
# tests/config was verified fully green (82 passed) on 2026-07-18 and is included
# without exclusions.
# 2026-08-04: the per-directory list is gone - the gate now runs the WHOLE suite.
# It could not before because the full run was red; the cause turned out to be
# tests inheriting the developer's global commit.gpgsign, fixed in #115. With
# that gone the full suite is green (1558 passed, 6 skipped, 7 xfailed, ~170s),
# so enumerating directories only creates new blind spots like the embedder one
# EMB-1 had to close. Anything genuinely unfit for the gate should be marked
# skip/xfail at the test, not omitted from a list here.
# The live-DB recall sweep in tests/recall remains opt-in via its own env guard.
# See the "test-debt + expand CI" backlog item before widening further.
gate_cmd: "ruff check src/axon/router src/axon/resilience tests/router tests/resilience && pytest -q"
setup_cmd: "pip install -e \".[dev]\""   # same as CI (ci.yml); shared venv already provisioned
labels:
  ready: agent:ready
  blocked: agent:blocked

# posture (axon is an internal context engine, not a customer-facing product)
posture: internal
# risk_areas ARM the classifier floor: normalize_classification.py greps these keywords
# in the issue text and forces effective_tier=Legendary on a match (closes the classifier
# false-clear gap). Keywords are the tool/artifact names an issue actually says, not the
# category name. Over-match is the safe direction (false-escalate > false-clear); axon-
# ubiquitous words like "chunk"/"token" are deliberately excluded so the floor does not
# escalate every issue. Tune per real routing/cost.
risk_areas:
  - restricted-context: [ctx=work, DENY_RESTRICTED, PolicyRegistry, work-data barrier, dec-109]
  - destructive-tools: [AXON_ALLOW_DESTRUCTIVE, destructive, hard-delete, drop table, purge]
  - secrets: [gitleaks, bandit, credential, api key, .env]
  - chunker: [chunker, java chunker, D5]
  - migration: [migration, migrate, alembic, schema, dec-121, backend cutover]
quality_rubric:
  testability: true
  scalability: true
  progression: true

# Async cross-vendor review lens (Codex) on every FORGE PR - see
# forge/references/cross-review.md. Advisory, never gates the pass.
cross_review: true

# Notes for the loop operator (axon-specific):
# - Worktrees are SAFE here: the root conftest.py inserts the worktree-relative
#   src (no editable install), so per-worktree tests validate that worktree's code.
# - pytest can HANG ON EXIT (unclosed asyncpg pool past the printed summary);
#   wrap gate runs in a timeout and read the printed "N passed/failed".
# - The full `pytest -q` is GREEN on master as of 2026-08-04: 1547 passed,
#   6 skipped, 7 xfailed. This note previously claimed it was RED from
#   "pre-existing test debt (benchmark, some hooks TTY+Windows cases)". That was
#   wrong on every count. The 29 failures were tests that `git init` a temp repo
#   inheriting the developer's GLOBAL commit.gpgsign; with the signing key absent
#   every commit died. Not TTY, not Windows, not benchmark, not an env leak.
#   Fixed in #115 by an autouse fixture pinning GIT_CONFIG_GLOBAL/SYSTEM to
#   os.devnull. CI never saw it because CI has no signing config.
#   (tests/doctor left this exclusion list on 2026-07-06; tests/benchmark was
#   listed as red until 2026-08-03, when it measured 27 passed.)
#   The full suite is now a candidate for the gate - see the widening follow-up.
# - The gate needs a working Docker daemon: the pg-backed tests guard with
#   pytest.importorskip("testcontainers.postgres"), which skips on a missing
#   PACKAGE, not a missing daemon. Without Docker they ERROR rather than skip.

services:
  # Single backend since dec-121 (Qdrant, Redis and SQLite retired).
  axon-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
      POSTGRES_DB: axon
    ports:
      - "5433:5432"
    volumes:
      - ./data/axon-postgres:/var/lib/postgresql/data
    restart: unless-stopped

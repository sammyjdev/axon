name: lesson-search-semantic-canary

# MANUAL ONLY. The nightly schedule was removed before it ever ran, for two
# reasons that both have to be fixed before it comes back:
#
# 1. IT HAS NOTHING WORTH CHECKING YET. The paraphrase test it runs stores TWO
#    invented lessons - one about `mapfile`, one about `imaplib` - which are
#    semantically opposite. Any working embedder separates them, so the test
#    cannot fail for a reason anyone would care about. The real corpus is
#    clustered: 4 lessons under `python-test`, 3 under `shell-script`, 3 under
#    `git`, 3 under `benchmark`, and 16 of its 105 pairs share a trigger. The
#    question that matters is whether a paraphrase about heredocs retrieves
#    `heredoc-binds-to-last-command` rather than `bash32-no-mapfile` - both
#    bash, both shell, both about a command behaving unexpectedly. Until the
#    canary asks THAT, against a seeded corpus, a green light means nothing.
# 2. It needs a DEEPINFRA_API_KEY repository secret, which does not exist. On a
#    PUBLIC repo that is a decision about exposing a paid key, not a chore.
#
# Bring the schedule back when the corpus is seeded AND the assertions
# discriminate within a cluster - ideally scored as recall@1 or MRR over a
# question set, the way gnomon-eval scores retrieval, rather than one pass/fail.
#
# Until then, run the same check locally when touching the embedding path:
#   AXON_RUN_LESSON_SEARCH=1 .venv/bin/python -m pytest tests/store/test_lesson_search.py -v
#
# Original rationale, still accurate. Task 6's real bge-m3 paraphrase test
# (tests/store/test_lesson_search.py::test_paraphrased_query_ranks_the_paraphrased_lesson_first)
# is opt-in via AXON_RUN_LESSON_SEARCH=1 and SKIPPED by every job in ci.yml -
# nothing in the normal gate proves lesson search is actually semantic, only
# that its SQL and wiring are correct (see tests/store/test_lesson_search_metric.py
# and tests/mcp/test_lesson_tools.py for what the gate DOES cover). This job
# is the one place that real claim gets checked, against the live bge-m3
# provider chain (Ollama is unavailable in CI, so this falls through to
# DeepInfra - see src/axon/embedder/providers.py and
# src/axon/config/runtime.py::_DEFAULT_EMBEDDER_CHAIN_ORDER).
#
# Operator action item: this job needs a `DEEPINFRA_API_KEY` repository
# secret. As of this workflow's introduction the repo has no such secret
# (only ANTHROPIC_API_KEY exists) - until it is added, this job will fail on
# every run with a clear "provider failed" error rather than silently
# reporting green, which is the point: a canary that cannot authenticate is
# worse than no canary, because it trains everyone to ignore it. Add the key
# at https://github.com/sammyjdev/axon/settings/secrets/actions.

on:
  workflow_dispatch: {}

jobs:
  semantic-canary:
    name: SEMANTIC CANARY - lesson search paraphrase (real bge-m3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install project + dev deps
        run: pip install -e ".[dev]"
      - name: pytest - real paraphrase retrieval (bge-m3 via DeepInfra)
        env:
          AXON_RUN_LESSON_SEARCH: "1"
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: >
          python3 -m pytest tests/store/test_lesson_search.py::test_paraphrased_query_ranks_the_paraphrased_lesson_first
          -v

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axon-context-mcp"
version = "0.1.1"
description = "Agent-agnostic context network — same context across any AI coding agent"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AXON contributors" }]
keywords = ["mcp", "coding-agent", "context", "ai-agents", "local-first", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Dependency policy (2026-08-07): every runtime and [http] dependency carries a
# MAJOR ceiling. Two production bugs in one week came from unbounded floors -
# mcp>=1.0.0 resolving to 2.0.0, which removed mcp.server.fastmcp and left the
# MCP server non-importable, and undeclared PyMuPDF breaking the Obsidian
# importer. Neither was visible until the full suite entered CI.
#
# Ceilings are the next major above the version this project is actually tested
# on, so patches and minors still float. 0.x pins to <1.0: for those projects the
# 1.0 step is the breaking one, and their minors have shipped fine here (typer
# 0.12 -> 0.25 without issue, which is why this is a ceiling and not a freeze).
#
# [dev] and [bench] are deliberately NOT capped: a break there fails
# CI loudly and gets fixed in the same session, while a runtime break ships to
# whoever runs pip install.
#
# Raising a ceiling is a normal change - bump it, let the full-suite CI job run,
# and keep it if green.
dependencies = [
    # Migrated to 2.x on 2026-08-07 (DEBT-2). 2.0 dropped `mcp.server.fastmcp`
    # for `mcp.server.mcpserver.MCPServer`; the decorator API is unchanged, so
    # the move was one import. Validated before committing, A/B against 1.29.0
    # in a Linux container: 22/22 tools register, the serialised wire contract is
    # identical for all 22, the dec-109 risk gate decides identically, and `ctx`
    # still reaches traced_tool through call_tool. See tests/mcp/test_tool_contract.py
    # and tests/mcp/test_risk_gate_through_protocol.py, which exist because
    # nothing detected that class of drift before.
    "mcp[cli]>=2.0.0,<3",
    "typer>=0.12.0,<1.0",
    "click>=8.2,<9",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.0,<3",
    "structlog>=24.0,<27",
    "pyyaml>=6.0,<7",
    "asyncpg>=0.29,<1.0",
]

[project.urls]
Homepage = "https://github.com/sammyjdev/axon"
Repository = "https://github.com/sammyjdev/axon"
Documentation = "https://github.com/sammyjdev/axon#readme"

[project.scripts]
axon = "axon.__main__:app"

[project.optional-dependencies]
http = [
    # Dashboard and activity API (axon serve-http).
    # Install with: pip install axon-context-mcp[http]
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
    "testcontainers[postgres]>=4.0.0",
    "hypothesis>=6.0",
    # httpx is needed to test the FastAPI HTTP endpoint with TestClient.
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
]
bench = [
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/axon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Match requires-python (>=3.11) so ruff never suggests py312-only syntax
# (e.g. PEP 695 generics), which would SyntaxError on the 3.11 CI runner.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is the standard pytest idiom in test files, not a security finding.
"tests/**" = ["S101"]
